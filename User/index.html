<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aion.Studio</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js"><meta name="theme-color" content="#F5E5C9">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--grey:#92938D;--cream:#F5E5C9;--peach:#D29375;--ink:#1a1816;--pad:clamp(16px,4vw,48px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Montserrat,system-ui,sans-serif;color:var(--ink);background:var(--cream)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* Hero stage: grey circle | cream | peach circle */
.hero{position:relative;height:100svh;min-height:520px;overflow:hidden;touch-action:pan-y;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hero::before,.hero::after{content:"";position:absolute;top:50%;width:90vmax;height:90vmax;border-radius:50%;transform:translateY(-50%)}
.hero::before{background:var(--grey);left:calc(-90vmax + 36%)}
.hero::after{background:var(--peach);right:calc(-90vmax + 36%)}

/* Navigation */
.nav{position:absolute;inset:env(safe-area-inset-top,0px) 0 auto 0;z-index:5;display:flex;align-items:center;gap:var(--pad);padding:22px var(--pad)}
.logo{font-weight:700;font-size:1.25rem;letter-spacing:.04em}
.links{display:flex;gap:clamp(20px,4vw,56px);margin:0 auto;font-weight:600;font-size:.9rem;letter-spacing:.04em}
.links a{position:relative;padding:4px 0}
.links a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ink);transform:scaleX(0);transition:transform .25s}
.links a:hover::after{transform:scaleX(1)}
.icons{display:flex;gap:18px;align-items:center}
.icons svg,.burger svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.burger{display:none}

/* Drawer */
.drawer{position:fixed;inset:0 0 0 auto;width:min(82vw,320px);background:var(--cream);z-index:20;padding:80px 28px;display:flex;flex-direction:column;gap:26px;
  font-weight:600;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(26,24,22,.35);z-index:19;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer .x{position:absolute;top:22px;right:22px;font-size:1.6rem}

/* Watches */
.track{position:absolute;inset:0}
.w{position:absolute;left:50%;top:47%;width:var(--s);aspect-ratio:1/2;margin-left:calc(var(--s)/-2);margin-top:calc(var(--s)*-1);
  display:grid;place-items:center;transition:transform .6s cubic-bezier(.2,.7,.2,1),opacity .5s;will-change:transform;cursor:pointer}
.w img,.w svg{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 22px rgba(0,0,0,.28));pointer-events:none;-webkit-user-drag:none}
.w[data-p="0"]{--s:clamp(150px,26vw,340px);transform:translateX(0) scale(1);z-index:3}
.w[data-p="-1"]{--s:clamp(150px,26vw,340px);transform:translateX(calc(var(--g) * -1)) scale(.62);z-index:2}
.w[data-p="1"]{--s:clamp(150px,26vw,340px);transform:translateX(var(--g)) scale(.62);z-index:2}
.w[data-p="h"]{--s:clamp(150px,26vw,340px);transform:scale(.3);opacity:0;pointer-events:none}
.hero{--g:clamp(105px,29vw,380px)}

.caption{position:absolute;left:0;right:0;bottom:15%;text-align:center;z-index:4;padding:0 var(--pad);pointer-events:none}
.caption h1{font-size:clamp(1.3rem,4.2vw,2.3rem);font-weight:700;letter-spacing:.03em;text-transform:uppercase;transition:opacity .3s}
.caption p{margin-top:6px;font-weight:600;font-size:clamp(.7rem,1.8vw,.9rem);letter-spacing:.08em;text-transform:uppercase}

.arrow{position:absolute;top:50%;z-index:5;width:46px;height:46px;border-radius:50%;background:var(--ink);display:grid;place-items:center;transform:translateY(-50%);transition:transform .2s}
.arrow:active{transform:translateY(-50%) scale(.92)}
.arrow svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.arrow.l{left:var(--pad)}.arrow.r{right:var(--pad)}

.social{position:absolute;right:var(--pad);bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:8px}
.social a{width:30px;height:30px;border-radius:7px;background:var(--ink);color:var(--peach);display:grid;place-items:center;font-size:.7rem;font-weight:700}

.state{position:absolute;inset:0;display:grid;place-items:center;z-index:4;font-weight:600;letter-spacing:.06em}

@media(max-width:760px){
  .links{display:none}.burger{display:block}
  .nav{gap:14px}.icons{margin-left:auto}
  .arrow{top:auto;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:none;width:42px;height:42px}
  .arrow:active{transform:scale(.92)}
  .arrow.l{left:var(--pad)}.arrow.r{right:auto;left:calc(var(--pad) + 54px)}
  .caption{bottom:20%}
  .hero::before{left:calc(-90vmax + 22%)}.hero::after{right:calc(-90vmax + 22%)}
}

/* Store sections */
#home{background:var(--cream)}
.sec{padding:clamp(44px,7vw,88px) var(--pad)}.sec>*{max-width:1240px;margin-inline:auto}
.sec h2{font-size:clamp(1.3rem,3vw,1.9rem);font-weight:700;margin-bottom:24px}
.sec.alt{background:#efdcbc}
.cats{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.cat{flex:0 0 auto;padding:14px 26px;border:1.5px solid var(--ink);border-radius:999px;font-weight:600;font-size:.9rem;transition:background .2s,color .2s}
.cat:hover{background:var(--ink);color:var(--cream)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr);gap:22px}}
@media(min-width:1040px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fbf3e3;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .img{position:relative;display:block;aspect-ratio:1;background:#fff8ea;padding:14px}
.card .img img,.card .img svg{width:100%;height:100%;object-fit:contain}
.badge{position:absolute;top:10px;left:10px;background:var(--peach);color:#fff;font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:999px}
.card .b{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:.95rem;font-weight:600;line-height:1.3}
.price{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.price b{font-size:1.05rem}.price s{opacity:.55;font-size:.85rem}
.stock{font-size:.78rem;font-weight:600}.stock.low{color:#a8481f}.stock.out{color:#777}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;padding-top:8px}
.btn{min-height:44px;border-radius:10px;font-weight:600;font-size:.82rem;border:1.5px solid var(--ink);display:grid;place-items:center}
.btn.p{background:var(--ink);color:var(--cream)}.btn[disabled]{opacity:.4;cursor:not-allowed}
.offer{display:grid;gap:18px;align-items:center;background:var(--peach);border-radius:18px;padding:clamp(26px,5vw,56px);min-height:220px}
.offer h2{margin:0}.offer .btn{width:fit-content;padding:0 28px;background:var(--ink);color:var(--cream)}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.col{background:var(--grey);color:#fff;border-radius:16px;min-height:180px;padding:24px;display:flex;align-items:flex-end;font-weight:700;font-size:1.2rem}
.story{max-width:680px!important;text-align:center}.story p{line-height:1.8;margin-top:8px}
.more{display:block;margin:28px auto 0;padding:0 34px}
.empty{padding:30px;text-align:center;opacity:.7}
footer{background:var(--ink);color:var(--cream);padding:48px var(--pad) calc(30px + env(safe-area-inset-bottom,0px));display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
footer a{display:block;padding:5px 0;opacity:.8;font-size:.9rem}footer h4{margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,90px);background:var(--ink);color:var(--cream);padding:12px 20px;border-radius:10px;z-index:30;transition:transform .3s;font-size:.9rem}
.toast.on{transform:translate(-50%,0)}
.cnt{position:absolute;top:-8px;right:-9px;min-width:17px;height:17px;border-radius:9px;background:var(--ink);color:var(--cream);font-size:.65rem;font-weight:700;display:grid;place-items:center}
.icons a{position:relative}

body.pg .hero{height:auto;min-height:0;overflow:visible;background:var(--cream)}
body.pg .hero::before,body.pg .hero::after,body.pg .track,body.pg .caption,body.pg .arrow,body.pg .social,body.pg .state{display:none}
body.pg .nav{position:static}body.pg #home{display:none}
#page{display:none;max-width:1100px;margin:auto;padding:12px var(--pad) 70px;min-height:70vh}body.pg #page{display:block}
.w .front{display:block}.w[data-p="0"] .side{display:none}.w:not([data-p="0"]) .front{display:none}
.back{display:inline-block;margin:8px 0 16px;font-weight:600;font-size:.9rem}
.pgrid{display:grid;gap:26px}@media(min-width:800px){.pgrid{grid-template-columns:1.1fr 1fr}}
.big{aspect-ratio:1;background:#fff8ea;border-radius:16px;padding:18px;display:grid;place-items:center}.big img,.big svg{width:100%;height:100%;object-fit:contain}
.thumbs{display:flex;gap:10px;margin-top:10px;overflow-x:auto}.thumbs button{flex:0 0 68px;height:68px;border-radius:10px;background:#fff8ea;border:2px solid transparent;padding:4px}.thumbs img{width:100%;height:100%;object-fit:contain}
.pp h1{font-size:1.5rem;margin-bottom:10px}.pp h2{margin:0 0 14px}.pp p.d{line-height:1.7;margin:12px 0;white-space:pre-wrap}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--ink);border-radius:10px}.qty button{width:42px;height:42px;font-size:1.2rem}.qty b{min-width:34px;text-align:center}
.crow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:#fbf3e3;border-radius:12px;padding:10px;margin-bottom:10px}.crow img,.crow svg{width:64px;height:64px;object-fit:contain}
.sum{background:#fbf3e3;border-radius:14px;padding:16px;display:grid;gap:8px}.sum div{display:flex;justify-content:space-between}
.fm{display:grid;gap:12px}.fm input,.fm textarea,.fm select,.modal input{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid #e2d3b6;border-radius:10px;background:#fffaf0;font:inherit;font-size:16px;color:var(--ink)}
.fm label{display:grid;gap:5px;font-size:.8rem;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(26,24,22,.45);z-index:40;display:grid;place-items:center;padding:16px}.modal[hidden]{display:none}
.modal form{background:var(--cream);border-radius:18px;padding:26px;width:min(100%,380px);display:grid;gap:12px;position:relative}.modal h2{margin:0}
.modal .x{position:absolute;top:8px;right:14px;font-size:1.7rem}.modal a{font-size:.85rem;font-weight:600;text-decoration:underline}
.msg{font-size:.85rem;min-height:1.2em}.msg.e{color:#a8481f}
.ord{background:#fbf3e3;border-radius:14px;padding:16px;margin-bottom:14px;display:grid;gap:6px;font-size:.9rem}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:700;background:#e2d3b6}.pill.g{background:#cfe0c3}.pill.r{background:#efc3b0}
.fm .btn,.pp .btn{padding:0 22px}

[hidden]{display:none!important}
/* skeletons and image fade-in */
@keyframes sh{to{background-position:-200% 0}}
.sk i,.skh,.sk .img,.hsk i,.card .img{background:linear-gradient(90deg,#efe0c4 25%,#f7ebd3 50%,#efe0c4 75%);background-size:200% 100%}
.sk i,.skh,.sk .img,.hsk i{animation:sh 1.2s infinite linear}
.sk i{display:block;height:12px;border-radius:6px;margin:8px 0;width:85%}.skh{display:block;height:22px;width:180px;border-radius:6px;margin-bottom:24px}
.sk .b{padding:14px}.hsk{pointer-events:none}.hsk i{display:block;width:62%;height:78%;border-radius:999px;opacity:.7}
.card .img img,.big img,.crow img,.w img,.thumbs img{opacity:0;transition:opacity .35s}
img.ok{opacity:1!important}
/* cards: image, name, subtitle, price, heart */
.nr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.nr h1,.nr h3{flex:1}
.heart{flex:0 0 auto;padding:4px;color:var(--ink);line-height:0}
.card h3{font-size:.95rem}.card .sub{font-size:.8rem;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* compact footer (home only) */
footer{display:block;padding:0;background:var(--ink)}
footer #ftb{width:100%;min-height:58px;display:flex;justify-content:space-between;align-items:center;padding:0 var(--pad);color:var(--cream);font-weight:600;font-size:.9rem;text-align:left}
footer #ftb svg{width:20px;height:20px;stroke:var(--cream);fill:none;stroke-width:2;transition:transform .25s}footer.open #ftb svg{transform:rotate(180deg)}
.ftc{display:none;padding:6px var(--pad) 26px;gap:20px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}footer.open .ftc{display:grid}
body.pg footer{display:none}
/* addresses */
.astrip{display:grid;gap:8px}.addr{text-align:left;padding:12px;border:1.5px solid #e2d3b6;border-radius:12px;background:#fffaf0;font-size:.85rem;line-height:1.5}.addr.on{border-color:var(--ink)}
/* login tabs */
.tabs2{display:grid;grid-template-columns:1fr 1fr;background:#e9d9b8;border-radius:10px;padding:4px}.tabs2 button{min-height:40px;border-radius:8px;font-weight:600}.tabs2 button.on{background:var(--ink);color:var(--cream)}
.or{text-align:center;font-size:.8rem;opacity:.6}
/* bottom tabs (mobile) */
.tabs{display:none}
@media(max-width:760px){
 body{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
 .tabs{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fffaf0;border-top:1px solid #e2d3b6;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
 .tabs a{display:grid;justify-items:center;gap:3px;font-size:.72rem;font-weight:600;opacity:.6;position:relative}.tabs a.on{opacity:1}
 .tabs svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
 .tabs .cnt{top:-4px;right:calc(50% - 24px)}
 .burger,.icons a[href="#/checkout"]{display:none}
 .hero{height:calc(100svh - 66px - env(safe-area-inset-bottom,0px))}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>

<input id="an" placeholder="Full name" autocomplete="name" hidden><input id="ae" type="email" placeholder="Email" autocomplete="username"><input id="ap" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">

<script type="module">
/* ---------- Firebase config: paste yours to go live ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyDP235IaQ7DWvOdA4oVCiNJ_EygkxXk2F0",
  authDomain: "aionstudio-38649.firebaseapp.com",
  projectId: "aionstudio-38649",
  storageBucket: "aionstudio-38649.firebasestorage.app",
  messagingSenderId: "266968563013",
  appId: "1:266968563013:web:faa2d70e0da96ae072122c",
  measurementId: "G-VT69JY6E3S"
};
const FIREBASE_CONFIG = firebaseConfig.apiKey ? firebaseConfig : null; /* stays in demo mode until apiKey is filled */

let slides = [], heroReady = !FIREBASE_CONFIG, loaded = !FIREBASE_CONFIG, fresh = false, cur = 0, social = {}, FS, AU, DB, AUTH, me = null, site = {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const n = slides.length, track = $("track");
  if(!heroReady){ if(!track.dataset.sk){track.dataset.sk=1;track.innerHTML=[-1,0,1].map(p=>`<div class="w hsk" data-p="${p}"><i></i></div>`).join("")} return; }
  if(track.dataset.sk){delete track.dataset.sk;track.innerHTML=""}
  if(!n){ $("state").hidden=false; $("state").textContent = FIREBASE_CONFIG ? "No watches published yet." : "Add your Firebase config to load the store."; track.innerHTML=""; $("hl").textContent=""; $("sub").textContent=""; return; }
  $("state").hidden = true;
  if(track.children.length !== n){
    track.innerHTML = slides.map((s,i)=>`<div class="w" data-i="${i}" role="link" tabindex="0" aria-label="${esc(s.headline)}">${heroImgs(s,i)}</div>`).join("");
  }
  [...track.children].forEach((el,i)=>{
    let d = ((i - cur) % n + n) % n; if(d > n/2) d -= n;
    el.dataset.p = Math.abs(d) <= 1 ? d : "h";
    if(n===2 && d===-1) el.dataset.p = "1"; /* 2 slides: centre + one side */
  });
  const s = slides[cur]; $("hl").textContent = s.headline||""; $("sub").textContent = s.subtitle||"";
}
const go = d => { if(slides.length>1){ cur = (cur + d + slides.length) % slides.length; render(); } };
const open = s => { if(s.productId) location.hash = "#/p/" + encodeURIComponent(s.productId); };

$("prev").onclick = () => go(-1); $("next").onclick = () => go(1);
$("track").addEventListener("click", e => {
  const el = e.target.closest(".w"); if(!el || el.dataset.p==="h" || swiped) return;
  open(slides[+el.dataset.i]);
});
$("track").addEventListener("keydown", e => { if(e.key==="Enter"){ const el=e.target.closest(".w"); if(el) open(slides[+el.dataset.i]); }});
addEventListener("keydown", e => { if(e.key==="ArrowLeft") go(-1); if(e.key==="ArrowRight") go(1); });

/* Swipe (pointer events: touch + mouse) */
let x0=null, y0=0, swiped=false;
const hero = $("hero");
hero.addEventListener("pointerdown", e => { x0 = e.clientX; y0 = e.clientY; swiped=false; });
hero.addEventListener("pointerup", e => {
  if(x0===null) return; const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
  if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)*1.5){ swiped = true; go(dx<0 ? 1 : -1); setTimeout(()=>swiped=false,50); }
});
hero.addEventListener("pointercancel", () => x0 = null);

/* Drawer */
const drawer = v => { $("drawer").classList.toggle("open",v); $("scrim").classList.toggle("open",v); };
$("open").onclick = () => drawer(true); $("close").onclick = $("scrim").onclick = () => drawer(false);

function renderSocial(){
  const map = {facebook:"f",instagram:"ig",twitter:"x",whatsapp:"wa"};
  const links = Object.keys(map).filter(k => social[k]);
  $("social").innerHTML = links.map(k=>`<a href="${esc(social[k]||"#")}" aria-label="${k}" rel="noopener">${map[k]}</a>`).join("");

/* Live data from Firebase (admin-managed) */
async function connect(){
  const base = "https://www.gstatic.com/firebasejs/10.14.1/";
  const [appM, authM, fs] = await Promise.all(["app","auth","firestore"].map(n => import(base + `firebase-${n}.js`)));
  const app = appM.initializeApp(FIREBASE_CONFIG); FS = fs; AU = authM; DB = fs.getFirestore(app); AUTH = authM.getAuth(app);
  const { collection, query, where, onSnapshot, doc } = fs;
  liveHome({db:DB,collection,query,where,onSnapshot,doc});
  onSnapshot(query(collection(DB,"heroSlides"), where("enabled","==",true)), snap => {
    const list = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (a.order ?? 0) - (b.order ?? 0));
    if (JSON.stringify(list) !== JSON.stringify(slides)) { slides = list; const c = list.findIndex(s => s.isCenter); cur = c >= 0 ? c : 0; $("track").innerHTML = ""; }
    heroReady = true; render(); saveCache();
  }, () => { heroReady = true; slides = []; render(); $("state").hidden = false; $("state").textContent = "Couldn't load watches. Refresh to try again."; });
  onSnapshot(doc(DB,"settings","site"), d => { site = d.data() || {}; social = site.social || {}; setLogo(); renderSocial(); route(); saveCache(); }, () => {});
  AU.onAuthStateChanged(AUTH, u => { me = u; addrs = null; if (u) $("auth").hidden = true; route(); });
}


/* ---------- Store: cart ---------- */
const CK="aion_cart"; /* {productId: qty}; synced to users/{uid}/cart once login ships */
const getCart=()=>{try{return JSON.parse(localStorage.getItem(CK))||{}}catch{return{}}};
function addCart(id,q=1){const p=products.find(x=>x.id===id);if(!p||p.stock<=0)return false;
  const c=getCart();c[id]=Math.min((c[id]||0)+q,p.stock);setCart(c);return true}
function setCart(c){try{localStorage.setItem(CK,JSON.stringify(c))}catch{}cartBadge()}
function cartBadge(){const n=Object.values(getCart()).reduce((a,b)=>a+b,0);for(const id of ["cnt","cnt2"]){$(id).hidden=!n;$(id).textContent=n}}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}

let products=[];
let cats=[];
let homeCfg={sections:[{key:"categories",on:1},{key:"featured",on:1},{key:"bestsellers",on:1},{key:"offers",on:1},{key:"newarrivals",on:1},{key:"collections",on:1},{key:"all",on:1},{key:"story",on:1}]};

try{const c=JSON.parse(localStorage.getItem("aion_c")||"null");if(c&&FIREBASE_CONFIG){products=c.products||[];loaded=!!c.products;slides=c.slides||[];heroReady=!!c.slides;cats=c.cats||[];site=c.site||{};social=site.social||{};homeCfg={...homeCfg,...(c.homeCfg||{})}}}catch{}

const heartI=on=>`<svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 20.5s-7.5-4.6-9.2-9.2C1.6 7.8 3.6 4.5 7 4.5c2 0 3.5 1.1 5 3 1.5-1.9 3-3 5-3 3.4 0 5.4 3.3 4.2 6.8-1.7 4.6-9.2 9.2-9.2 9.2z" fill="${on?"#c0392b":"none"}" stroke="${on?"#c0392b":"currentColor"}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;

  <div class="b"><div class="nr"><h3><a href="${href}">${esc(p.name)}</a></h3><button class="heart" data-heart="${esc(p.id)}" aria-label="Save to wishlist" aria-pressed="${w}">${heartI(w)}</button></div><p class="sub">${esc(p.shortDesc||p.category)}</p><div class="price"><b>${inr(d?p.salePrice:p.price)}</b>${d?`<s>${inr(p.price)}</s>`:""}</div></div></article>`}
function toggleWish(id){let w=wish();const on=!w.includes(id);w=on?[...w,id]:w.filter(x=>x!==id);try{localStorage.setItem("aion_wish",JSON.stringify(w))}catch{}

 offers:()=>{const b=homeCfg.banner;return b?.title?`<section class="sec"><div class="offer" ${b.image?`style="background:url('${esc(b.image)}') center/cover"`:""}><h2>${esc(b.title)}</h2><p>${esc(b.text)}</p><a class="btn" href="${esc(b.link||"#/all")}">Shop the offers</a></div></section>`:""},

  const err=()=>{$("home").innerHTML='<div class="sec"><p class="empty">Couldn\'t load the store. Refresh to try again.</p></div>'};
  onSnapshot(query(collection(db,"products"),where("published","==",true)),s=>{products=s.docs.map(d=>({id:d.id,...d.data()}));loaded=true;fresh=true;saveCache();renderHome();route()},err);
  onSnapshot(collection(db,"categories"),s=>{cats=s.docs.map(d=>({id:d.id,...d.data()}));saveCache();renderHome()},()=>{});

/* ---------- Pages: #/p/ID  #/all  #/checkout  #/orders  #/about  #/contact  #/policy/x ---------- */
const pg = h => { $("page").innerHTML = h; };
const dtime = o => o.createdAt?.toDate ? o.createdAt.toDate() : null;
const heroI = (u, c, i) => `<img class="${c}" src="${esc(u)}" alt="" loading="${i < 3 ? "eager" : "lazy"}" decoding="async">`;
function heroImgs(s, i) { if (s.svg) return s.svg; const a = s.sideImage || s.frontImage || s.image, b = s.frontImage || s.sideImage || s.image; return a ? heroI(a, "side", i) + heroI(b, "front", i) : ""; }
const gate = t => `<div class="pp"><h2>${t}</h2><p class="d">You can browse and add watches without an account. To order, please log in or create an account.</p><button class="btn p" style="width:fit-content" data-login>Log in or sign up</button></div>`;
function route() {
  const [r, a] = location.hash.replace(/^#\/?/, "").split("/"), arg = decodeURIComponent(a || "");
  document.body.classList.toggle("pg", !!r);
  document.querySelectorAll(".tabs a").forEach(t => t.classList.toggle("on", t.dataset.t === (r || "")));
  if (!r) return;
  const f = { p:productPage, all:allPage, checkout:checkoutPage, orders:ordersPage, wishlist:wishlistPage, account:accountPage }[r];
  f ? f(arg) : infoPage(r, arg);
}
addEventListener("hashchange", () => { route(); scrollTo(0, 0); });
function buyNow(id, q = 1) {
  const p = products.find(x => x.id === id); if (!p || p.stock <= 0) return;
  setCart({ [id]: Math.min(q, p.stock) }); location.hash = "#/checkout"; if (!me) openAuth();
}

function productPage(id) {
  const p = products.find(x => x.id === id);
  if (!p) return pg(`<div class="pp"><a class="back" href="#/">&larr; Back to shop</a><p class="empty">${loaded ? "This watch isn't available." : "Loading…"}</p></div>`);
  const imgs = [...new Set([p.image, ...(p.gallery || [])].filter(Boolean))], d = pct(p), out = p.stock <= 0;
  pg(`<div class="pp"><a class="back" href="#/">&larr; Back to shop</a><div class="pgrid"><div><div class="big" id="big">${imgs[0] ? `<img src="${esc(imgs[0])}" alt="${esc(p.name)}">` : p.svg || ""}</div>${imgs.length > 1 ? `<div class="thumbs">${imgs.map((u, i) => `<button data-img="${esc(u)}" aria-label="Image ${i + 1}"><img src="${esc(u)}" alt="" loading="lazy"></button>`).join("")}</div>` : ""}</div>
  <div><div class="nr"><h1>${esc(p.name)}</h1><button class="heart" data-heart="${esc(p.id)}" aria-label="Save to wishlist">${heartI(wish().includes(p.id))}</button></div><div class="price" style="font-size:1.3rem"><b>${inr(d ? p.salePrice : p.price)}</b>${d ? `<s>${inr(p.price)}</s><span class="badge" style="position:static">${d}% off</span>` : ""}</div>
  <p class="stock ${out ? "out" : ""}" style="margin:8px 0">${out ? "Out of stock" : p.stock <= 5 ? `Only ${p.stock} left` : "In stock"}</p>
  ${p.shortDesc ? `<p class="d"><b>${esc(p.shortDesc)}</b></p>` : ""}<p class="d">${esc(p.description)}</p>
  ${out ? "" : `<div class="qty"><button data-q="-1" aria-label="Less">&minus;</button><b id="qv">1</b><button data-q="1" aria-label="More">+</button></div><div class="acts" style="margin-top:16px"><button class="btn" data-padd="${esc(p.id)}">Add to Cart</button><button class="btn p" data-pbuy="${esc(p.id)}">Buy Now</button></div>`}</div></div></div>`);
}

function allPage(cat) {
  pg(`<div class="pp"><h2>All watches</h2><div class="fm" style="margin-bottom:18px"><input id="sq" type="search" placeholder="Search watches"><select id="sc"><option value="">All categories</option>${cats.map(c => `<option value="${esc(c.id)}" ${c.id === cat ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select></div><div id="sg"></div></div>`);
  const draw = () => { const q = $("sq").value.toLowerCase(), c = $("sc").value; $("sg").innerHTML = grid(products.filter(p => (!q || String(p.name).toLowerCase().includes(q)) && (!c || p.category === c || p.categoryId === c)), loaded ? "No watches match." : "Loading…"); };
  $("sq").oninput = $("sc").onchange = draw; draw();
}

function checkoutPage() {
  if (!me) return pg(gate("Log in to continue"));
  const cart = getCart(), items = Object.keys(cart).map(id => ({ p: products.find(x => x.id === id), q: cart[id] })).filter(x => x.p);
  if (!items.length) return pg(`<div class="pp"><h2>Your cart is empty</h2><a class="btn p" style="width:fit-content" href="#/">Continue shopping</a></div>`);
  const price = p => pct(p) ? p.salePrice : p.price, sub = items.reduce((a, x) => a + price(x.p) * x.q, 0), sh = site.shipping || {};
  const ship = sh.enabled === false ? null : (sh.freeAbove > 0 && sub >= sh.freeAbove ? 0 : (sh.charge || 0));
  pg(`<div class="pp"><h2>Checkout</h2><div class="pgrid"><div>${items.map(({ p, q }) => `<div class="crow">${p.image ? `<img src="${esc(p.image)}" alt="">` : p.svg || "<span></span>"}<div><b>${esc(p.name)}</b><div>${inr(price(p))}</div>${q > p.stock ? `<div class="msg e">Only ${p.stock} in stock</div>` : ""}</div><div><div class="qty"><button data-cq="${esc(p.id)}" data-d="-1" aria-label="Less">&minus;</button><b>${q}</b><button data-cq="${esc(p.id)}" data-d="1" aria-label="More">+</button></div><button data-rm="${esc(p.id)}" style="display:block;margin:6px auto 0;font-size:.78rem;text-decoration:underline">Remove</button></div></div>`).join("")}<a href="#/" style="font-weight:600;font-size:.9rem">&larr; Continue shopping</a></div>
  <form id="of" class="fm" novalidate><div class="sum"><div><span>Subtotal</span><b>${inr(sub)}</b></div><div><span>Shipping</span><b>${ship === null ? "Unavailable" : ship ? inr(ship) : "Free"}</b></div><div style="font-size:1.1rem"><span>Total</span><b>${ship === null ? "-" : inr(sub + ship)}</b></div></div>
  <div id="asv"></div><label>Full name<input name="name" value="${esc(me.displayName || "")}" autocomplete="name"></label><label>Phone number<input name="phone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel"></label><label>Delivery address<textarea name="line" rows="3" autocomplete="street-address"></textarea></label><label>City<input name="city" autocomplete="address-level2"></label><label>Pincode<input name="pin" inputmode="numeric" maxlength="6" autocomplete="postal-code"></label><button class="btn" type="button" data-saveaddr>Save this address</button>
  <p class="msg">Payment: cash on delivery. You can cancel within 6 hours of ordering.</p><button class="btn p" id="po" ${ship === null ? "disabled" : ""}>Place order</button><p class="msg" id="om" role="alert"></p></form></div></div>`);
  if (addrs) drawAddrStrip(); else loadAddrs().then(() => { if (location.hash === "#/checkout") drawAddrStrip(); });
}

async function ordersPage() {
  if (!me) return pg(gate("Log in to see your orders"));
  pg(`<div class="pp"><h2>My orders</h2><p class="empty">Loading…</p></div>`);
  try {
    const sn = await FS.getDocs(FS.query(FS.collection(DB, "orders"), FS.where("userId", "==", me.uid)));
    if (location.hash !== "#/orders") return;
    const l = sn.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (dtime(b)?.getTime() || 0) - (dtime(a)?.getTime() || 0));
    pg(`<div class="pp"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="margin:0">My orders</h2><button class="btn" style="min-height:38px;padding:0 16px" data-logout>Log out</button></div>${l.length ? l.map(o => {
      const t = dtime(o), open = ["pending", "confirmed"].includes(o.status), can = open && t && Date.now() - t.getTime() < 6 * 3600e3;
      return `<div class="ord"><div><b>Order ${esc(o.id.slice(0, 8))}</b> <span class="pill ${o.status === "cancelled" ? "r" : o.status === "delivered" ? "g" : ""}">${esc(o.status)}</span></div><div>${t ? t.toLocaleString("en-IN") : ""}</div><div>${(o.items || []).map(i => `${esc(i.name)} &times; ${i.qty}`).join("<br>")}</div><div><b>${inr(o.total)}</b> &middot; ${o.paymentMethod === "cod" ? "Cash on delivery" : esc(o.paymentMethod)} (${esc(o.paymentStatus)})</div><div>Deliver to: ${esc(o.address?.line)}, ${esc(o.address?.city)} ${esc(o.address?.pincode)}</div>${can ? `<button class="btn" style="width:fit-content;margin-top:6px" data-cancel="${esc(o.id)}">Cancel order</button>` : open ? `<small>The 6-hour cancellation window has passed.</small>` : ""}</div>`;
    }).join("") : `<p class="empty">You haven't placed any orders yet.</p>`}</div>`);
  } catch { pg(`<div class="pp"><p class="empty">Couldn't load your orders. Refresh to try again.</p></div>`); }
}

const POL = { shipping:"Shipping policy", returns:"Return policy", refund:"Refund policy", privacy:"Privacy policy", terms:"Terms and conditions" };
function infoPage(r, k) {
  let t, b;
  if (r === "about") { t = "About " + (site.storeName || "Aion.Studio"); b = site.description || homeCfg.story; }
  else if (r === "contact") { t = "Contact us"; b = [site.supportEmail && "Email: " + site.supportEmail, site.phone && "Phone: " + site.phone, site.address && "Address: " + site.address].filter(Boolean).join("\n"); }
  else if (r === "policy" && POL[k]) { t = POL[k]; b = site.policies?.[k]; }
  else return allPage("");
  pg(`<div class="pp"><a class="back" href="#/">&larr; Back</a><h1>${esc(t)}</h1><p class="d">${esc(b) || "This page hasn't been published yet."}</p></div>`);
}

async function cancelOrder(id) {
  if (!confirm("Cancel this order?")) return;
  try { await FS.updateDoc(FS.doc(DB, "orders", id), { status: "cancelled", cancelledAt: FS.serverTimestamp(), updatedAt: FS.serverTimestamp() }); toast("Order cancelled"); ordersPage(); }
  catch { toast("Couldn't cancel. The 6-hour window may have passed."); }
}

$("page").addEventListener("click", e => {
  const g = k => e.target.closest(`[data-${k}]`); let b;
  if (b = g("img")) $("big").innerHTML = `<img src="${esc(b.dataset.img)}" alt="">`;
  if (b = g("q")) { const v = $("qv"); v.textContent = Math.max(1, Math.min(99, +v.textContent + +b.dataset.q)); }
  if (b = g("padd")) { if (addCart(b.dataset.padd, +$("qv").textContent)) toast("Added to cart"); }
  if (b = g("pbuy")) buyNow(b.dataset.pbuy, +$("qv").textContent);
  if (b = g("add")) { if (addCart(b.dataset.add)) toast("Added to cart"); }
  if (b = g("buy")) buyNow(b.dataset.buy);
  if (b = g("cq")) { const c = getCart(), p = products.find(x => x.id === b.dataset.cq); c[b.dataset.cq] = Math.max(1, Math.min((c[b.dataset.cq] || 1) + +b.dataset.d, p?.stock || 1)); setCart(c); checkoutPage(); }
  if (b = g("rm")) { const c = getCart(); delete c[b.dataset.rm]; setCart(c); checkoutPage(); }
  if (b = g("cancel")) cancelOrder(b.dataset.cancel);
  if (b = g("useaddr")) { const a = addrs.find(x => x.id === b.dataset.useaddr), f = $("of"); if (a && f) { const set = (k, v) => f.elements[k].value = v || ""; set("name", a.name); set("phone", a.phone); set("line", a.line); set("city", a.city); set("pin", a.pin); document.querySelectorAll(".addr").forEach(x => x.classList.toggle("on", x === b)); } }
  if (g("saveaddr")) saveAddr();
  if (b = g("deladdr")) delAddr(b.dataset.deladdr);
  if (g("login")) openAuth();
  if (g("logout")) { AU.signOut(AUTH); location.hash = "#/"; }
});
$("page").addEventListener("submit", async e => {
  if (e.target.id !== "of") return; e.preventDefault();
  const f = new FormData(e.target), v = k => String(f.get(k) || "").trim(), m = t => { $("om").textContent = t; $("om").className = "msg e"; };
  const bad = checkAddr(v); if (bad) return m(bad); if (!fresh) return m("Still loading the latest prices. Try again in a moment.");
  const cart = getCart(), items = [];
  for (const id of Object.keys(cart)) {
    const p = products.find(x => x.id === id); if (!p) continue;
    if (cart[id] > p.stock) return m(`${p.name}: only ${p.stock} in stock. Reduce the quantity.`);
    items.push({ productId: id, name: p.name, qty: cart[id], price: pct(p) ? p.salePrice : p.price, image: p.image || "" });
  }
  if (!items.length) return m("Your cart is empty.");
  const sub = items.reduce((a, i) => a + i.price * i.qty, 0), sh = site.shipping || {}, ship = sh.freeAbove > 0 && sub >= sh.freeAbove ? 0 : (sh.charge || 0);
  $("po").disabled = true; $("om").textContent = "Placing your order…"; $("om").className = "msg";
  try {
    await FS.addDoc(FS.collection(DB, "orders"), { userId: me.uid, customerName: v("name"), email: me.email || "", phone: v("phone"), address: { line: v("line"), city: v("city"), pincode: v("pin") }, items, subtotal: sub, shipping: ship, total: sub + ship, paymentMethod: "cod", paymentStatus: "unpaid", status: "pending", createdAt: FS.serverTimestamp() });
    FS.setDoc(FS.doc(DB, "users", me.uid), { name: v("name"), phone: v("phone"), email: me.email || "" }, { merge: true }).catch(() => {});
    setCart({}); toast("Order placed"); location.hash = "#/orders";
  } catch { $("po").disabled = false; m("We couldn't place your order. Check your connection and try again."); }
});


/* ---------- Saved addresses, account, wishlist ---------- */
let addrs = null;
const addrLine = a => `${esc(a.name)}, ${esc(a.phone)}<br>${esc(a.line)}, ${esc(a.city)} ${esc(a.pin)}`;
function checkAddr(v) {
  if (v("name").length < 2) return "Enter your full name.";
  if (!/^[6-9]\d{9}$/.test(v("phone"))) return "Enter a valid 10-digit mobile number.";
  if (v("line").length < 8) return "Enter your full delivery address.";
  if (!v("city")) return "Enter your city.";
  if (!/^\d{6}$/.test(v("pin"))) return "Enter a valid 6-digit pincode.";
  return "";
}
async function loadAddrs() {
  try { const sn = await FS.getDocs(FS.collection(DB, "users", me.uid, "addresses")); addrs = sn.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.at?.seconds || 0) - (b.at?.seconds || 0)); }
  catch { addrs = []; }
}
function drawAddrStrip() { const el = $("asv"); if (!el) return; el.innerHTML = addrs?.length ? `<p class="msg">Choose a saved address</p><div class="astrip">${addrs.map(a => `<button type="button" class="addr" data-useaddr="${esc(a.id)}">${addrLine(a)}</button>`).join("")}</div>` : ""; }
function drawAddrList() { const el = $("al"); if (el) el.innerHTML = addrs.length ? addrs.map(a => `<div class="ord"><div>${addrLine(a)}</div><button class="btn" style="width:fit-content;min-height:38px" data-deladdr="${esc(a.id)}">Delete</button></div>`).join("") : `<p class="empty">No saved addresses yet. You can save one while checking out.</p>`; }
async function saveAddr() {
  const f = $("of"), v = k => f.elements[k].value.trim(), m = (t, ok) => { $("om").textContent = t; $("om").className = "msg" + (ok ? "" : " e"); };
  const bad = checkAddr(v); if (bad) return m(bad);
  addrs = addrs || []; if (addrs.length >= 10) return m("You can save up to 10 addresses. Delete one in your account first.");
  const a = { name: v("name"), phone: v("phone"), line: v("line"), city: v("city"), pin: v("pin") };
  try { const r = await FS.addDoc(FS.collection(DB, "users", me.uid, "addresses"), { ...a, at: FS.serverTimestamp() }); addrs.push({ id: r.id, ...a }); drawAddrStrip(); m("Address saved.", 1); }
  catch { m("Couldn't save the address. Try again."); }
}
async function delAddr(id) {
  if (!confirm("Delete this address?")) return;
  try { await FS.deleteDoc(FS.doc(DB, "users", me.uid, "addresses", id)); addrs = addrs.filter(a => a.id !== id); drawAddrList(); } catch { toast("Couldn't delete. Try again."); }
}
async function accountPage() {
  if (!me) return pg(gate("Log in to your account"));
  pg(`<div class="pp"><h2>My account</h2><div class="sum" style="margin-bottom:16px"><div><span>Name</span><b>${esc(me.displayName || "-")}</b></div><div><span>Email</span><b>${esc(me.email)}</b></div></div><div class="acts" style="margin-bottom:22px"><a class="btn" href="#/orders">My orders</a><a class="btn" href="#/wishlist">Wishlist</a></div><h2 style="font-size:1.1rem">Saved addresses</h2><div id="al"><p class="empty">Loading…</p></div><button class="btn" data-logout style="margin-top:20px">Log out</button></div>`);
  if (!addrs) await loadAddrs(); if (location.hash === "#/account") drawAddrList();
}
function wishlistPage() { const ids = wish(), l = products.filter(p => ids.includes(p.id)); pg(`<div class="pp"><h2>Wishlist</h2>${grid(l, "Tap the heart on a watch to save it here.")}</div>`); }

/* ---------- Login / register (browsing never needs it) ---------- */
let amode = "in";
function setMode(m) { amode = m; $("tin").classList.toggle("on", m === "in"); $("tup").classList.toggle("on", m === "up"); $("an").hidden = m === "in"; $("afg").hidden = m !== "in"; $("ago").textContent = m === "in" ? "Log in" : "Create account"; $("ap").autocomplete = m === "in" ? "current-password" : "new-password"; $("amsg").textContent = ""; }
function openAuth() { if (!AUTH) { toast("Login isn't available yet."); return; } setMode("in"); $("auth").hidden = false; }
$("ax").onclick = () => $("auth").hidden = true;
$("tin").onclick = () => setMode("in"); $("tup").onclick = () => setMode("up");
$("acct").onclick = e => { if (!me) { e.preventDefault(); openAuth(); } };
$("drawer").onclick = e => { if (e.target.closest("a")) drawer(false); };
$("ftb").onclick = () => { const o = $("ft").classList.toggle("open"); $("ftb").setAttribute("aria-expanded", o); if (o) setTimeout(() => $("ft").scrollIntoView({ behavior: "smooth", block: "end" }), 50); };
$("afg").onclick = async e => { e.preventDefault(); const em = $("ae").value.trim(), m = $("amsg"); if (!em) { m.className = "msg e"; m.textContent = "Enter your email first."; return; } try { await AU.sendPasswordResetEmail(AUTH, em); } catch {} m.className = "msg"; m.textContent = "If that email has an account, a reset link is on its way."; };
$("af").onsubmit = async e => {
  e.preventDefault(); const em = $("ae").value.trim(), pw = $("ap").value, nm = $("an").value.trim(), m = $("amsg"); m.className = "msg e";
  if (!AUTH) { m.textContent = "Login isn't available yet."; return; }
  if (!em || pw.length < 6) { m.textContent = "Enter your email and a password of at least 6 characters."; return; }
  if (amode === "up" && nm.length < 2) { m.textContent = "Enter your name."; return; }
  $("ago").disabled = true; m.className = "msg"; m.textContent = "Please wait…";
  try {
    if (amode === "in") await AU.signInWithEmailAndPassword(AUTH, em, pw);
    else { const c = await AU.createUserWithEmailAndPassword(AUTH, em, pw); await AU.updateProfile(c.user, { displayName: nm }); FS.setDoc(FS.doc(DB, "users", c.user.uid), { name: nm, email: em, createdAt: FS.serverTimestamp() }, { merge: true }).catch(() => {}); }
    $("auth").hidden = true; $("ap").value = "";
  } catch (err) { m.className = "msg e"; m.textContent = ({ "auth/invalid-credential":"Email or password is incorrect.", "auth/email-already-in-use":"That email already has an account. Log in instead.", "auth/weak-password":"Choose a longer password.", "auth/invalid-email":"Enter a valid email." })[err.code] || "Couldn't continue. Check your connection and try again."; }
  $("ago").disabled = false;
};
$("ag").onclick = async () => {
  try { const c = await AU.signInWithPopup(AUTH, new AU.GoogleAuthProvider()); FS.setDoc(FS.doc(DB, "users", c.user.uid), { name: c.user.displayName || "", email: c.user.email || "" }, { merge: true }).catch(() => {}); $("auth").hidden = true; }
  catch { $("amsg").className = "msg e"; $("amsg").textContent = "Google sign-in didn't complete."; }
};

/* images fade in once loaded (and never stay invisible) */
const okImgs = () => document.querySelectorAll("img:not(.ok)").forEach(i => { if (i.complete) i.classList.add("ok"); });
addEventListener("load", e => { if (e.target.tagName === "IMG") e.target.classList.add("ok"); }, true);
addEventListener("error", e => { if (e.target.tagName === "IMG") e.target.classList.add("ok"); }, true);
new MutationObserver(okImgs).observe(document.body, { childList: true, subtree: true });

route();
setLogo(); render(); renderSocial();
if(FIREBASE_CONFIG) connect().catch(() => { $("state").hidden = false; $("state").textContent = "Couldn't connect. Refresh to try again."; });
</script>
</body>
</html>
